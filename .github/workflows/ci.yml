name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A branch that's also an open PR head gets both a `push` and a
# `pull_request` run for the same commit; cancel the older one. head_ref
# (pull_request only) and ref_name (push) resolve to the same branch name,
# so both event shapes share one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      # Each workspace is tested with --cwd so app/bunfig.toml's matchMedia
      # preload applies to the app tests; a root `bun test` would skip it.
      - name: Test shared
        run: bun test --cwd shared
      - name: Test broker
        run: bun test --cwd broker
      - name: Test mcp
        run: bun test --cwd mcp
      - name: Test app
        run: bun test --cwd app

      - name: Build Mini App
        run: bun --cwd app run build