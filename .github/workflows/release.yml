name: Release

# On a version tag: build the Mini App and attach dist/ to the GitHub
# release for that tag. The broker serves app/dist in production (see the
# README's deploy section), so a release asset is the deployable artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & attach Mini App dist
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build Mini App
        run: bun run --cwd app build

      - name: Upload dist (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: app/dist

      # Attach dist/ to the release created from this tag. files-only —
      # body/name are unset so an existing release's notes are preserved.
      - name: Attach dist to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/dist/**/*

  publish-npm:
    name: Publish CLI to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build CLI bundle
        run: bun run build:cli

      # No-op until NPM_TOKEN is set as a repo secret; then every v* tag publishes.
      # `secrets` is not allowed in `if:` (actions/runner#520), so the token is
      # promoted to job-level env and gated via env.NPM_TOKEN here.
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun publish --access public